name: E2E

# Manual only until the full test pass. The 2026-09-23 shakedown left the
# suite red on known product defects (see tests/e2e/README.md → Known
# failures), and a gate that is red on every PR teaches people to ignore it.
# Once the templates and mobile fixes are in and the a11y baseline has been
# recorded, restore:
#
#   pull_request:
#   push:
#     branches: [ main, develop ]
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Target site
        required: false
        default: https://southerndestinations.lightspeedwp.dev

# The suite is read-only, but it does hit a shared dev server. One run at a
# time per branch keeps the load predictable and cancels superseded runs.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: ${{ matrix.project }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Visual is excluded deliberately: baselines are platform-specific and
        # there are none committed for Linux. Add a `visual` entry once a set
        # has been generated on this runner image.
        project: [ desktop, tablet, mobile, responsive, a11y ]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      - name: Run ${{ matrix.project }}
        run: npx playwright test --project=${{ matrix.project }}
        env:
          WP_BASE_URL: ${{ github.event.inputs.base_url || 'https://southerndestinations.lightspeedwp.dev' }}

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ matrix.project }}
          path: tests/e2e/playwright-report/
          retention-days: 14

  editor:
    name: editor
    runs-on: ubuntu-latest
    # Signed in, so it needs the WP_ADMIN_USER / WP_ADMIN_PASS secrets. Secrets
    # are not exposed to fork pull requests, so this only runs for branches on
    # this repository — the same gate as the plugin's e2e-admin job.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    # `secrets` cannot be read in a job-level `if`, so they are lifted into the
    # environment and checked per step. Without them the config drops the
    # `setup` and `editor` projects entirely, and `--project=editor` would fail
    # on "project not found" — skip with a notice instead.
    env:
      WP_BASE_URL: ${{ github.event.inputs.base_url || 'https://southerndestinations.lightspeedwp.dev' }}
      WP_ADMIN_USER: ${{ secrets.WP_ADMIN_USER }}
      WP_ADMIN_PASS: ${{ secrets.WP_ADMIN_PASS }}
    steps:
      - name: Skip without admin credentials
        if: env.WP_ADMIN_USER == '' || env.WP_ADMIN_PASS == ''
        run: echo "::notice::WP_ADMIN_USER / WP_ADMIN_PASS are not set on this repository — editor project skipped."

      - uses: actions/checkout@v4
        if: env.WP_ADMIN_USER != '' && env.WP_ADMIN_PASS != ''

      - uses: actions/setup-node@v4
        if: env.WP_ADMIN_USER != '' && env.WP_ADMIN_PASS != ''
        with:
          node-version: 20
          cache: npm

      - run: npm ci
        if: env.WP_ADMIN_USER != '' && env.WP_ADMIN_PASS != ''

      - run: npx playwright install --with-deps chromium
        if: env.WP_ADMIN_USER != '' && env.WP_ADMIN_PASS != ''

      # `editor` depends on `setup`, so Playwright signs in first.
      - name: Run editor
        if: env.WP_ADMIN_USER != '' && env.WP_ADMIN_PASS != ''
        run: npx playwright test --project=editor

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && env.WP_ADMIN_USER != '' && env.WP_ADMIN_PASS != '' }}
        with:
          name: playwright-report-editor
          path: tests/e2e/playwright-report/
          retention-days: 14
