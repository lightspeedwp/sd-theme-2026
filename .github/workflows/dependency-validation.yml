name: dependency validation

# Untrusted stage. Runs pull-request code inside a disposable one-job container
# on the dependency-ci-ephemeral group. Holds no merge, enrolment or
# runner-manager credential. Never uses the persistent trusted merge runner.
#
# Deliberately toolchain-free: the container ships git/curl/jq only. Do NOT add
# shivammathur/setup-php here - its self-hosted locking calls sudo, which is what
# caused the 2026-08-03 security-mail incident. Anything needing PHP, Composer or
# npm must bring its own pinned static tooling.
#
# GitHub's own Dependabot cannot be routed to our self-hosted runners - a PR
# IT authored gets this workflow's job queued indefinitely on a self-hosted
# runner unless the org enables "Dependabot on self-hosted runners" org-wide,
# which is deliberately off (that setting also hands Dependabot's own
# internal update job access to self-hosted infra - a materially bigger
# trust boundary than validating one PR). So a Dependabot-authored PR runs
# this job on a standard GitHub-hosted runner instead; every other PR still
# gets the private runner. Routed on github.event.pull_request.user.login,
# NOT github.actor: actor is whoever triggered this specific push (a human
# pushing a fix commit onto the PR branch, as this repo's own session did to
# unblock CI, counts) and would misroute a Dependabot PR back to the private
# runner the moment anyone else pushes to it; pull_request.user.login is who
# opened the PR and does not change on a later push, which is the actual
# question being asked. The choose-runner job is the documented way to make
# runs-on conditional - it does not support an inline ternary expression,
# only a single substituted value (a string, or here a needs.*.outputs value
# parsed with fromJson for an array).
#
# Managed centrally by lightspeedwp/dependency-merge-controller.

on:
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

concurrency:
  group: dependency-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  choose-runner:
    name: choose-runner
    if: |
      startsWith(github.head_ref, 'dependabot/') ||
      startsWith(github.head_ref, 'deps/') ||
      startsWith(github.head_ref, 'renovate/')
    runs-on: ubuntu-latest
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
    steps:
      - id: pick
        env:
          # github.actor is whoever triggered THIS push (a human rebasing or
          # pushing a fix commit onto the branch counts, same as we did
          # ourselves this session). github.event.pull_request.user.login is
          # who originally opened the PR and does not change on a later
          # push - that is the actual trust question this routes on.
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          if [ "$PR_AUTHOR" = "dependabot[bot]" ]; then
            echo 'runner=["ubuntu-latest"]' >> "$GITHUB_OUTPUT"
          else
            echo 'runner=["self-hosted","linux","x64","dependency-ci-ephemeral"]' >> "$GITHUB_OUTPUT"
          fi

  validate:
    name: dependency-validation
    needs: choose-runner
    runs-on: ${{ fromJson(needs.choose-runner.outputs.runner) }}
    timeout-minutes: 20
    env:
      GITLEAKS_VERSION: '8.30.1'
      GITLEAKS_SHA256: '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb'
      BASE_REF: ${{ github.base_ref }}
    steps:
      - name: Confirm disposable container
        # Only meaningful on the self-hosted ephemeral container: a
        # GitHub-hosted runner genuinely has a docker socket and runs as a
        # non-root "runner" user by design, so these checks would misfire
        # there. Gated on the same PR-author check choose-runner used
        # (github.event.pull_request.user.login, not github.actor - see the
        # comment on the pick step), to keep one source of truth for "is
        # this the Dependabot-on-GitHub-hosted path".
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        run: |
          set -euo pipefail
          echo "container=$(hostname) user=$(id -un) uid=$(id -u)"
          # Fail closed if this is not the isolated container we expect.
          [ "$(id -u)" != "0" ] || { echo 'running as root - refusing'; exit 1; }
          [ ! -e /var/run/docker.sock ] || { echo 'docker socket present - refusing'; exit 1; }
          [ ! -d /var/www ] || { echo 'client sites visible - refusing'; exit 1; }

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Secret scan (pinned, checksum verified)
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            -o "${tmp}/${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tmp}/${tarball}" | sha256sum --check --status
          tar -xzf "${tmp}/${tarball}" -C "${tmp}" gitleaks
          if [ -f .gitleaks.toml ]; then
            "${tmp}/gitleaks" dir . --config .gitleaks.toml --redact --no-banner
          else
            "${tmp}/gitleaks" dir . --redact --no-banner
          fi

      - name: Dependency manifest sanity
        run: |
          set -euo pipefail
          # A lockfile change with no manifest change, or vice versa, is a
          # signal the trusted stage should not merge on. Report, do not judge.
          if [ -z "${BASE_REF}" ]; then
            echo "BASE_REF is empty - refusing to diff against an unbounded ref" >&2
            exit 1
          fi
          changed="$(git diff --name-only "origin/${BASE_REF}"...HEAD || true)"
          echo "changed files:"; printf '%s\n' "${changed}"
          for pair in "composer.json:composer.lock" "package.json:package-lock.json"; do
            m="${pair%%:*}"; l="${pair##*:}"
            if printf '%s\n' "${changed}" | grep -qx "${l}" \
               && ! printf '%s\n' "${changed}" | grep -qx "${m}"; then
              echo "note: ${l} changed without ${m}"
            fi
          done
          echo "validation complete"
